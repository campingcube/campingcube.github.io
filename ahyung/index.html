<script>
// 아형회 모임판 Firebase판 어댑터 (fbshim)
// 하는 일: claude.ai가 주던 window.claude.use("db" | "user" | "sample")를 Firebase(Firestore + 익명 로그인)로 흉내 낸다.
// 그래서 시험판 src.html은 거의 그대로 쓴다.
// 순서: 익명 로그인 → 입장 화면(참여코드 / 회장 비밀번호 / 처음 설정) → 통과하면 window.__appGate가 풀리고 앱이 시작됨.
// 무료(Spark) 요금제 기능만 씀: Firestore, 익명 로그인. (Storage·Functions·Hosting 안 씀)
// 설정값은 build-fb.js가 window.__FB_CONFIG로 넣어 준다 (공개돼도 되는 값).
// 시험 모드: 주소 끝에 ?fbmock=1 이고 fbmock.js가 같이 들어 있을 때만 가짜 Firebase(메모리)를 씀. 게시본에는 fbmock.js가 없음.
(function () {
  "use strict";
  const SDK_VER = "10.12.2"; // 정확한 버전 고정 (gstatic 공식 주소)
  const SDK = ["app", "auth", "firestore"].map((n) => "https://www.gstatic.com/firebasejs/" + SDK_VER + "/firebase-" + n + "-compat.js");
  const CFG = window.__FB_CONFIG || null;
  const q = new URLSearchParams(location.search);
  const MOCK = q.get("fbmock") === "1" && !!window.__FBMOCK;
  const CODE_MIN = 4, PASS_MIN = 6, MAX_LEN = 40; // 참여코드 4자 이상, 회장 비밀번호 6자 이상
  const WAIT_MS = 15000; // 서버 답을 기다리는 시간

  let fb = null, auth = null, fs = null;
  let uid = null; // 이 기기의 Firebase 익명 계정 id
  let isAdmin = false; // admins/{uid} 있음 = 회장
  let logicalId = null; // 앱이 "내 계정 id"로 쓰는 값 (비밀번호로 연결한 기기는 그 회원의 원래 계정 id)
  let linkMemberId = null; // links/{uid}.memberId (비밀번호로 연결한 회원)

  let openGate;
  const gate = new Promise((res) => { openGate = res; });
  window.__appGate = gate;

  /* ---------- 작은 도구 ---------- */
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  function withWait(p, ms) {
    return Promise.race([p, sleep(ms || WAIT_MS).then(() => { throw Object.assign(new Error("timeout"), { code: "deadline-exceeded" }); })]);
  }
  function uerr(msg, code) { return Object.assign(new Error(code || msg), { userMsg: msg, code: code || "app" }); }
  const norm = (v) => String(v == null ? "" : v).normalize("NFC").trim();
  // 해시: SHA-256("ahyung:" + 값)을 16진수로. 평문은 어디에도 저장하지 않음
  async function hash(v) {
    if (!(window.crypto && crypto.subtle)) throw uerr("이 브라우저에서는 암호 계산을 할 수 없어요. 크롬이나 사파리로 열어 주세요.", "no-crypto");
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("ahyung:" + v));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  const pinValue = (memberId, pin) => memberId + ":" + pin; // 회원마다 다른 해시가 나오게 회원 id를 붙임
  const isDenied = (e) => !!e && (e.code === "permission-denied" || /permission/i.test(String(e.message || "")));

  }
  function loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src; s.async = false; s.crossOrigin = "anonymous";

    });
  }
  // 앱이 넘기는 값은 claude.ai 저장소처럼 JSON 모양으로 정리 (undefined 칸 빼기, NaN → null 등)
  function clean(d) {
    const out = JSON.parse(JSON.stringify(d === undefined ? null : d));
    (function chk(v, inArr) {
      if (Array.isArray(v)) { if (inArr) throw uerr("저장할 수 없는 모양이에요 (목록 안의 목록).", "invalid-argument"); v.forEach((x) => chk(x, true)); }
      else if (v && typeof v === "object") Object.keys(v).forEach((k) => chk(v[k], false));
    })(out, false);
    return out;
  }
  const docPath = (p) => String(p).replace(/^\/+|\/+$/g, "");

  /* ---------- window.claude.use("db") 흉내 ---------- */
  // 문서 스냅샷: { id, exists, data(), metadata, ref }
  function wrapDocSnap(s) {
    const ex = typeof s.exists === "function" ? s.exists() : !!s.exists;
    const raw = ex ? s.data() : undefined;
    const json = raw === undefined ? undefined : JSON.stringify(raw);
    return {
      id: s.id, exists: ex, ref: wrapDoc(s.ref),
      data: () => (json === undefined ? undefined : JSON.parse(json)),
      get: (field) => { const d = json === undefined ? undefined : JSON.parse(json); return String(field).split(".").reduce((a, k) => (a == null ? undefined : a[k]), d); },
      metadata: { hasPendingWrites: !!(s.metadata && s.metadata.hasPendingWrites), fromCache: !!(s.metadata && s.metadata.fromCache) },
    };
  }
  // 목록 스냅샷: { docs, size, empty, docChanges(), forEach, metadata }
  function wrapQuerySnap(s) {
    const docs = s.docs.map(wrapDocSnap);
    return {
      docs, size: docs.length, empty: docs.length === 0,
      docChanges: () => s.docChanges().map((c) => ({ type: c.type, doc: wrapDocSnap(c.doc), oldIndex: c.oldIndex, newIndex: c.newIndex })),
      forEach: (fn) => docs.forEach(fn),
      metadata: { hasPendingWrites: !!(s.metadata && s.metadata.hasPendingWrites), fromCache: !!(s.metadata && s.metadata.fromCache) },
    };
  }
  // onSnapshot(fn, errFn) 또는 onSnapshot({ next, error }) 둘 다 받음. 돌려주는 값 = 구독 끊기 함수
  function listen(ref, wrap, a, b) {
    const next = typeof a === "function" ? a : a && a.next, error = typeof a === "function" ? b : a && a.error;
    return ref.onSnapshot((s) => { if (next) next(wrap(s)); }, (e) => { console.warn("[fbshim] 구독 오류", ref.path || "", e); if (typeof error === "function") error(e); });
  }
  function wrapDoc(ref) {
    return {
      id: ref.id, path: ref.path,
      get: () => ref.get().then(wrapDocSnap),
      set: (data, opts) => ref.set(clean(data), opts && opts.merge ? { merge: true } : {}).then(() => undefined),
      update: (part) => ref.update(clean(part)).then(() => undefined), // "a.b" 같은 점 경로는 Firestore가 안쪽 칸으로 처리
      delete: () => ref.delete().then(() => undefined),
      onSnapshot: (a, b) => listen(ref, wrapDocSnap, a, b),
      collection: (name) => wrapCol(ref.collection(name)),
    };
  }
  function wrapQuery(qr) {
    const w = {
      where: (f, op, v) => wrapQuery(qr.where(f, op, v)),
      orderBy: (f, dir) => wrapQuery(qr.orderBy(f, dir || "asc")),
      limit: (n) => wrapQuery(qr.limit(n)),
      get: () => qr.get().then(wrapQuerySnap),
      onSnapshot: (a, b) => listen(qr, wrapQuerySnap, a, b),
    };
    return w;
  }
  function wrapCol(ref) {
    return Object.assign(wrapQuery(ref), {
      id: ref.id, path: ref.path,
      doc: (id) => wrapDoc(id == null ? ref.doc() : ref.doc(String(id))), // id 없으면 새 id
      add: (data) => ref.add(clean(data)).then(wrapDoc),
    });
  }
  const dbApi = {
    doc: (p) => wrapDoc(fs.doc(docPath(p))),
    collection: (p) => wrapCol(fs.collection(docPath(p))),
  };

  /* ---------- window.claude.use("user") 흉내 ---------- */
  async function resolveIdentity() {
    logicalId = uid; linkMemberId = null;
    try {
      const l = await withWait(fs.doc("links/" + uid).get());
      if (l.exists) {
        linkMemberId = String(l.data().memberId || "");
        const m = await withWait(fs.doc("members/" + linkMemberId).get());
        const u = m.exists ? m.data().userId : null;
        if (u) logicalId = String(u); // 그 회원의 원래 계정 id로 응답·신청 문서를 같이 씀 (규칙이 links로 허락)
      }
    } catch (e) { console.warn("[fbshim] 연결 확인 실패", e); }
  }
  const userApi = {
    id: async () => logicalId,
    isOwner: async () => isAdmin,
    canEdit: async () => isAdmin,
    can: async () => null,
    name: async () => null,
    me: async () => ({ id: logicalId, uid, name: null, isOwner: isAdmin, linkedMemberId: linkMemberId }),
    // ---- Firebase판에서만 있는 것 (src.html이 있을 때만 버튼을 보여 줌) ----
    linkedMemberId: () => linkMemberId,
    // 회원 휴대폰 비밀번호(숫자 4자리) 정하기: 그 회원과 연결된 본인 또는 회장
    async setPin(memberId, pin) {
      memberId = String(memberId || ""); pin = norm(pin);
      if (!/^\d{4}$/.test(pin)) throw uerr("숫자 4자리로 적어 주세요.", "bad-pin");
      const pinHash = await hash(pinValue(memberId, pin));
      try { await withWait(fs.doc("pins/" + memberId).set({ pinHash, at: Date.now() })); }
      catch (e) { throw isDenied(e) ? uerr("이 회원의 비밀번호를 정할 권한이 없어요.", "denied") : uerr(netMsg(e), e.code); }
    },
    // 새 휴대폰에서 비밀번호로 바로 연결: links/{uid} 만들기 (규칙이 pins와 비교)
    async linkWithPin(memberId, pin) {
      memberId = String(memberId || ""); pin = norm(pin);
      if (!/^\d{4}$/.test(pin)) throw uerr("숫자 4자리로 적어 주세요.", "bad-pin");
      if (linkMemberId) throw uerr("이 휴대폰은 이미 다른 회원으로 연결돼 있어요. 회장님께 말씀해 주세요.", "already");
      const pinHash = await hash(pinValue(memberId, pin));
      try { await withWait(fs.doc("links/" + uid).set({ memberId, pinHash, at: Date.now() })); }
      catch (e) { throw isDenied(e) ? uerr("비밀번호가 맞지 않아요. 비밀번호를 안 정했다면 회장님께 연결 요청을 보내 주세요.", "wrong") : uerr(netMsg(e), e.code); }
      await resolveIdentity();
    },
    // 회장: 참여코드·회장 비밀번호 바꾸기 (비워 둔 것은 그대로)
    async changeSecrets(v) {
      v = v || {};
      const code = norm(v.joinCode), pass = norm(v.adminPass);
      if (!code && !pass) throw uerr("바꿀 칸을 적어 주세요.", "empty");
      if (code && (code.length < CODE_MIN || code.length > MAX_LEN)) throw uerr("참여코드는 " + CODE_MIN + "~" + MAX_LEN + "자로 정해 주세요.", "short");
      if (pass && (pass.length < PASS_MIN || pass.length > MAX_LEN)) throw uerr("회장 비밀번호는 " + PASS_MIN + "~" + MAX_LEN + "자로 정해 주세요.", "short");
      if (code && pass && code === pass) throw uerr("참여코드와 회장 비밀번호는 다르게 정해 주세요.", "same");
      const part = { at: Date.now() };
      if (code) part.joinHash = await hash(code);
      if (pass) part.adminHash = await hash(pass);
      try { await withWait(fs.doc("config/secrets").update(part)); }
      catch (e) { throw isDenied(e) ? uerr("회장만 바꿀 수 있어요.", "denied") : uerr(netMsg(e), e.code); }
    },
  };

  window.claude = {
    // 입장 절차가 끝난 뒤에 답함. sample(큐플이 AI 초안) 등 그 밖은 null → 앱이 버튼을 숨김
    use: (name) => gate.then(() => (name === "db" ? dbApi : name === "user" ? userApi : null)),
  };

  /* ---------- 입장 화면 ---------- */
  let root = null;
  const el = (tag, props, ...kids) => {
    const e = document.createElement(tag);
    for (const k in props || {}) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);

  };
  function ensureRoot() {
    if (root) return root;
    const st = document.createElement("style");
    st.textContent = "#fb-gate{position:fixed;inset:0;z-index:300;overflow-y:auto;background:var(--bg,#FAF6EE);color:var(--text,#282828);" +
      "padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}" +
      "#fb-gate .gbox{max-width:440px;margin:0 auto}#fb-gate .gtop{text-align:center;margin:8px 0 16px}#fb-gate .gtop img{width:96px;height:96px}" +
      "#fb-gate h1{font:28px/36px var(--font-fun,sans-serif);margin:8px 0 4px}#fb-gate h2{font:22px/30px var(--font-fun,sans-serif);margin:0 0 6px}" +
      "#fb-gate .gerr{min-height:24px;margin-top:8px}#fb-gate .glink{margin-top:16px;width:100%}";
    document.head.appendChild(st);

    document.body.appendChild(root);

  }
  function screen(title, kids) {

    const art = typeof ART !== "undefined" && ART && ART["qple-wave"] ? el("img", { src: ART["qple-wave"], alt: "큐플이" }) : null;
    r.replaceChildren(el("div", { class: "gbox" }, el("div", { class: "gtop" }, art, el("h1", { id: "fb-gate-title" }, "아형회 모임판")), el("div", { class: "card" }, el("h2", null, title), kids)));
    const f = r.querySelector("input"); if (f) setTimeout(() => f.focus(), 30);
  }
  const field = (id, label, attrs) => el("div", { class: "field" }, el("label", { for: id }, label), el("input", Object.assign({ class: "input", id, autocomplete: "off", maxlength: String(MAX_LEN) }, attrs || {})));

  // 버튼 하나 + Enter로도 보내기
  function form(id, kids, btnText, onGo) {
    const err = el("div", { class: "err gerr", id: id + "-err", role: "alert", "aria-live": "assertive" });
    const btn = el("button", { class: "btn main full", type: "submit", id: id + "-go" }, btnText);
    const f = el("form", { id, novalidate: true, onsubmit: async (e) => {
      e.preventDefault();
      if (btn.disabled) return;

      try { const m = await onGo(); if (m) err.textContent = m; }
      catch (x) { console.warn("[fbshim]", x); err.textContent = (x && x.userMsg) || netMsg(x); }

  function showLoading(msg) { screen(msg || "들어가는 중이에요", el("p", { class: "small muted", id: "fb-gate-loading" }, "조금만 기다려 주세요.")); }
  function showError(e) {
    let why = netMsg(e);
    if (e && e.code === "sdk-load") why = "필요한 파일을 받지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.";
    if (e && e.code === "auth/operation-not-allowed") why = "모임판 설정이 아직 끝나지 않았어요 (익명 로그인이 꺼져 있음). 회장님께 알려 주세요.";
    if (e && e.code === "no-config") why = "모임판 설정값이 없어요. 회장님께 알려 주세요.";
    if (e && e.userMsg) why = e.userMsg;
    screen("연결하지 못했어요", [el("p", { class: "small", id: "fb-gate-why" }, why),

  }
  function showCode() {
    screen("참여코드를 입력해주세요", [
      el("p", { class: "small muted", style: "margin:0 0 8px" }, "회장님이 단톡방에 알려 준 코드를 넣어 주세요. 한 번 들어오면 이 휴대폰에서는 다시 안 물어봐요."),
      form("fb-code", [field("fb-code-in", "참여코드", { autocapitalize: "off", spellcheck: "false", enterkeyhint: "go" })], "들어가기", async () => {

        const codeHash = await hash(code);
        try { await withWait(fs.doc("joins/" + uid).set({ codeHash, at: Date.now() })); }

  function showAdmin() {

      el("p", { class: "small muted", style: "margin:0 0 8px" }, "회장님만 넣어 주세요. 이 휴대폰이 회장 휴대폰이 돼요."),
      form("fb-admin", [field("fb-admin-in", "회장 비밀번호", { type: "password", enterkeyhint: "go" })], "회장으로 들어가기", async () => {

        const passHash = await hash(pass);

        catch (e) { if (isDenied(e)) return "회장 비밀번호가 맞지 않아요"; throw e; }

        await enter();

      el("button", { class: "btn text glink", type: "button", id: "fb-to-code", onclick: showCode }, "참여코드로 들어가기"),
    ]);
  }
  function showSetup() {
    screen("처음 설정", [
      el("p", { class: "small", style: "margin:0 0 8px" }, "모임판을 처음 여셨어요. 회원이 들어올 때 넣는 참여코드와, 회장님만 쓰는 회장 비밀번호를 정해 주세요. 나중에 \"모임 정보 고치기\"에서 바꿀 수 있어요."),
      el("p", { class: "note warn", style: "margin:0 0 12px" }, "두 코드는 암호 모양(해시)으로만 저장돼서 다시 볼 수 없어요. 꼭 따로 적어 두세요."),
      form("fb-setup", [

      ], "설정 마치기", async () => {
        const code = val("fb-setup-code"), code2 = val("fb-setup-code2"), pass = val("fb-setup-pass"), pass2 = val("fb-setup-pass2");

        if (pass.length < PASS_MIN) return "회장 비밀번호를 " + PASS_MIN + "자 이상으로 정해 주세요.";
        if (pass !== pass2) return "회장 비밀번호 두 칸이 달라요.";
        if (code === pass) return "참여코드와 회장 비밀번호는 다르게 정해 주세요.";

.stamp { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--danger); color: var(--danger); font: 400 14px/1 var(--font-fun); transform: rotate(-12deg); opacity: .9; box-shadow: inset 0 0 0 2px var(--surface), inset 0 0 0 3.5px var(--danger); }

@keyframes stampIn { 0% { transform: scale(1.4) rotate(-12deg); opacity: 0 } 80% { transform: scale(1) rotate(-14deg); opacity: .9 } 100% { transform: scale(1) rotate(-12deg); opacity: .9 } }

/* 장소 고르기 */
.place-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.place-card { padding: 0; overflow: hidden; border-radius: var(--r-lg); border: 2px solid var(--border); background: var(--surface); box-shadow: var(--sh-card); cursor: pointer; text-align: left; color: inherit; font: inherit; }
.place-card .pic { height: 110px; overflow: hidden; }
.place-card .pic img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; display: block; }
.place-card .nm { padding: 10px 12px; font: 700 18px/26px var(--font-body); border-top: 4px solid var(--band, var(--accent)); }
.place-card:active { transform: translateY(2px); box-shadow: none; }
.banner { height: 120px; border-radius: var(--r-lg); overflow: hidden; border: 2px solid var(--border); }
.banner img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; display: block; }
.att-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.att { position: relative; border: 2px solid var(--border-soft); border-radius: var(--r-md); background: var(--surface-2); padding: 4px 2px 6px; cursor: pointer; text-align: center; font: 700 13px/18px var(--font-body); color: var(--text-muted); min-height: 48px; }
.att img { width: 100%; max-width: 64px; display: block; margin: 0 auto; opacity: .45; filter: grayscale(.8); }
.att span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att[aria-pressed="true"] { border: 3px solid var(--accent); background: var(--accent-soft); color: var(--text); }
.att[aria-pressed="true"] img { opacity: 1; filter: none; }
.att.who { color: var(--text); }
.att.who img { opacity: 1; filter: none; }
.att[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 2px; right: 6px; color: var(--accent); font-weight: 800; }

/* 장면 무대 */
.stage-wrap { max-width: 480px; margin: 12px auto 0; }
.stage { position: relative; width: 100%; aspect-ratio: 360 / 480; overflow: hidden; border-radius: var(--r-xl); border: 2px solid var(--border); background: var(--surface-2); user-select: none; -webkit-user-select: none; }
.stage > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ch { position: absolute; width: var(--w); left: calc(var(--x) - var(--w) / 2); bottom: var(--b); padding: 0; border: 0; background: transparent; cursor: pointer; transition: opacity .3s; }
.ch img.body { display: block; width: 100%; height: auto; transform-origin: 50% 100%; animation: sway 3s ease-in-out infinite; animation-delay: var(--d, 0s); }
.ch .tag { position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%); max-width: calc(100% + 8px); height: 22px; padding: 0 8px; border-radius: 8px; background: var(--tag-bg); color: var(--tag-text); border: 1.5px solid #282828; font: 700 13px/19px var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch.away img.body { opacity: .35; }
.ch .sign { position: absolute; left: 50%; top: 30%; transform: translateX(-50%) rotate(-4deg); background: var(--cream); color: #282828; border: 2px solid #282828; border-radius: 6px; padding: 2px 6px; font: 700 12px/16px var(--font-body); white-space: nowrap; }
.ch.flash img.body { filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 3px var(--venue-band)); transform: scale(1.08); }
.ch.picked img.body { filter: drop-shadow(0 0 8px #fff); animation: bounce .5s ease-in-out 6; }
.pop-mark { position: absolute; z-index: 50; font: 400 18px/1 var(--font-fun); color: #282828; background: var(--cream); border: 2px solid #282828; border-radius: 10px; padding: 3px 6px; animation: rise 2s ease-out forwards; pointer-events: none; }
@keyframes rise { 0% { transform: translateY(6px); opacity: 0 } 20% { opacity: 1 } 100% { transform: translateY(-14px); opacity: 0 } }
@keyframes sway { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(-2.5deg) } 75% { transform: rotate(2.5deg) } }
@keyframes bounce { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-8%) } }
@keyframes flip { 0%, 100% { transform: translateY(0) rotate(0) } 50% { transform: translateY(-6%) rotate(-7deg) } }
@keyframes munch { 0%, 100% { transform: scale(1, 1) } 50% { transform: scale(1.07, .94) } }
@keyframes dance { 0%, 100% { transform: rotate(0) translateX(0) } 25% { transform: rotate(-10deg) translateX(-4%) } 75% { transform: rotate(10deg) translateX(4%) } }
@keyframes giggle { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(-4deg) } 75% { transform: rotate(4deg) } }
@keyframes croon { 0%, 100% { transform: translateY(0) rotate(0) } 50% { transform: translateY(-4%) rotate(-5deg) } }
@keyframes bow { 0%, 100% { transform: rotate(0) scaleY(1) } 40%, 60% { transform: rotate(10deg) scaleY(.9) translateY(4%) } }
@keyframes waveit { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(-7deg) } 75% { transform: rotate(7deg) } }
.ch.g-grill img.body { animation: flip .4s ease-in-out 5; }
.ch.g-eat img.body { animation: munch .5s ease-in-out 4; }
.ch.g-dance img.body { animation: dance .5s ease-in-out 4; }
.ch.g-joke img.body { animation: giggle .25s ease-in-out 8; }
.ch.g-sing img.body { animation: croon 1s ease-in-out 2; }
.ch.g-bow img.body { animation: bow 1s ease-in-out 2; }
.ch.g-wave img.body, .ch.g-away img.body { animation: waveit .5s ease-in-out 4; }
.bubble { position: absolute; z-index: 40; max-width: 220px; filter: drop-shadow(0 3px 0 rgba(40,40,40,.18)); animation: bubIn .15s ease-out both; pointer-events: none; }
.bubble .o { background: var(--bubble-border); padding: 2px; clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%); }
.bubble .i { background: var(--bubble-bg); color: var(--bubble-text); clip-path: polygon(13px 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 13px 100%, 0 50%); min-height: 40px; padding: 9px 20px; font: 400 16px/22px var(--font-fun); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; overflow-wrap: anywhere; }
.bubble .tail { position: absolute; bottom: -9px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 10px solid var(--bubble-border); margin-left: -8px; }
.bubble .tail::after { content: ""; position: absolute; left: -5px; top: -12px; border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 7px solid var(--bubble-bg); }
.bubble.qple .i { background: var(--cream); }
.bubble.out { animation: bubOut .2s ease-in forwards; }
@keyframes bubIn { from { transform: scale(.8); opacity: 0 } to { transform: scale(1); opacity: 1 } }
@keyframes bubOut { to { opacity: 0; transform: scale(.9) } }
.strip { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 45; display: flex; justify-content: flex-end; }
.strip span { background: var(--tag-bg); color: var(--tag-text); border: 1.5px solid #282828; border-radius: 8px; padding: 0 8px; font: 700 13px/20px var(--font-body); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stamp-over { position: absolute; z-index: 60; left: 50%; top: 22%; margin-left: -48px; background: rgba(255,255,255,.85); }
.draw-card { display: flex; gap: 12px; align-items: center; }
.draw-card img { width: 56px; height: 56px; flex: 0 0 56px; }

/* 시트, 알림 */
.sheet-bg { position: fixed; inset: 0; z-index: 80; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; background: var(--surface); color: var(--text); border-radius: var(--r-xl) var(--r-xl) 0 0; border: 2px solid var(--border); border-bottom: 0; box-shadow: var(--sh-sheet); max-height: 85vh; overflow-y: auto;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet h2 { font: 400 20px/28px var(--font-fun); margin-bottom: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(130px + env(safe-area-inset-bottom, 0px)); z-index: 90; max-width: calc(100% - 32px); width: max-content; background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: var(--r-md); font: 600 15px/21px var(--font-body); box-shadow: var(--sh-card); }

.empty { text-align: center; padding: 32px 8px; }

.loading-dots::after { content: "..."; animation: dots 1.2s steps(4) infinite; display: inline-block; width: 1.5em; text-align: left; overflow: hidden; vertical-align: bottom; }
@keyframes dots { 0% { width: 0 } 100% { width: 1.5em } }

/* 정기모임 공지 */
.meet { padding: 0; overflow: hidden; }
.meet .mpic { position: relative; height: 150px; overflow: hidden; background: var(--surface-2); border-bottom: 2px solid var(--border); }
.meet .mpic > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.meet .mpic .faces { position: absolute; left: 4px; right: 4px; bottom: 2px; display: flex; justify-content: center; align-items: flex-end; }
.meet .mpic .faces img { flex: 0 1 80px; min-width: 0; width: 80px; margin: 0 -2px; }
.meet .mpic .faces img.wait { flex-basis: 46px; width: 46px; opacity: .45; filter: grayscale(.9); }
.meet .mpic .etc { position: absolute; inset: 0 0 40% 0; display: grid; place-items: center; font: 400 22px/28px var(--font-fun); color: var(--text-muted); }
.meet .body { padding: 14px 16px 16px; }
.meet .ttl { font: 400 24px/32px var(--font-fun); overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 10px 0 0; }
.kv dt { font: 700 14px/24px var(--font-body); color: var(--text-muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.mnotice { margin-top: 10px; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface-2); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 22px; }
.edited { margin: 0 0 6px; }
.hist-list { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 10px; min-width: 0; }
.hist-list li { min-width: 0; }
.hist .hist-list li + li { border-top: 1px solid var(--border-soft); padding-top: 10px; }
.hline { font-size: 15px; line-height: 22px; overflow-wrap: anywhere; }
.mnotice.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.mnotice.letter { font-size: 16px; line-height: 25px; padding: 12px 14px; }
.mnotice .ltxt { white-space: pre-wrap; overflow-wrap: anywhere; }
.mnotice .ltxt.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.notice-more { margin-top: 4px; padding-left: 0; }
textarea.input.letter-in { min-height: 220px; max-height: 70vh; resize: none; overflow-y: auto; line-height: 24px; }
.count { font: 700 13px/18px var(--font-body); color: var(--text-muted); text-align: right; margin-top: 4px; }
.count.over { color: var(--danger); }
.letter-tools { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 10px; }
.letter-tools .btn { width: 100%; }
.ai-box { margin-top: 12px; padding: 12px; border-radius: var(--r-md); border: 2px solid var(--accent); background: var(--accent-soft); min-width: 0; }
.ai-box .ai-head { display: flex; gap: 8px; align-items: center; font: 700 15px/22px var(--font-body); }
.ai-box .ai-head img { width: 40px; height: 40px; flex: 0 0 40px; }
.ai-prev { margin-top: 8px; padding: 10px 12px; min-height: 120px; max-height: 50vh; overflow-y: auto; border-radius: var(--r-md); background: var(--surface); color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 23px; }
.ai-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.ai-btns .btn { padding-left: 4px; padding-right: 4px; min-width: 0; }
.meet .mpic .etc.tbd { inset: 0 0 34% 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; font-size: 18px; line-height: 24px; text-align: center; padding: 0 8px; }
.meet .mpic .etc.tbd img { width: 52px; height: 52px; }
.place-card .pic.etc-pic img.tbd-q { width: 56px; height: 56px; object-fit: contain; }
.counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.counts > div { border-radius: var(--r-md); padding: 6px 4px; text-align: center; background: var(--surface-2); font: 700 13px/18px var(--font-body); }
.counts b { display: block; font: 400 24px/30px var(--font-fun); }
.counts .y { background: var(--success-soft); } .counts .y b { color: var(--success); }
.counts .n { background: var(--surface-2); } .counts .n b { color: var(--text); } /* 불참은 회색 (빨강은 삭제·신고에만) */
.rsvp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.rsvp .btn { min-height: 64px; font: 400 22px/28px var(--font-fun); }
.rsvp .btn.yes[aria-pressed="true"] { background: var(--success); color: var(--on-accent); border-color: var(--btn-border); }
.rsvp .btn.no[aria-pressed="true"] { background: var(--surface-2); color: var(--text); border: 3px solid var(--text-muted); box-shadow: none; }
.prow { display: flex; gap: 10px; align-items: center; min-height: 64px; padding: 6px 0; }
.prow + .prow { border-top: 1px solid var(--border-soft); }
/* 좁은 화면(320px 등): 이름 칸이 최소 7글자 폭을 갖고, 모자라면 버튼이 아래 줄로 내려감 */
.prow { flex-wrap: wrap; }
.prow > .grow { flex: 1 1 7.5em; min-width: 7.5em; }
.prow > .grow .row { flex-wrap: wrap; row-gap: 0; }
.prow > .grow strong { flex: 0 1 auto; min-width: 0; max-width: 100%; }
.prow > .grow .cap { white-space: nowrap; }
.prow > .seg { margin-left: auto; }
.seg { display: flex; gap: 6px; flex: 0 0 auto; }
.seg button { min-width: 56px; min-height: 48px; padding: 0 8px; border-radius: var(--r-md); border: 1px solid var(--border-soft); background: var(--surface-2); color: var(--text); font: 700 14px/18px var(--font-body); cursor: pointer; }
.seg button.yes[aria-pressed="true"] { background: var(--success-soft); color: var(--success-text); border: 2px solid var(--success); }
.seg button.no[aria-pressed="true"] { background: var(--surface); color: var(--text); border: 2px solid var(--text-muted); }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 12px; }

.place-grid.sm { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.place-card .pic.etc-pic { display: grid; place-items: center; background: var(--surface-2); font: 400 18px/1 var(--font-fun); color: var(--text-muted); }
.chip.ok { background: var(--success-soft); color: var(--success-text); border-color: var(--success); }
.chip.no { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
@keyframes lift { 0%, 100% { transform: translateY(0) rotate(0) } 25% { transform: translateY(-7%) rotate(-3deg) } 50% { transform: translateY(0) rotate(0) } 75% { transform: translateY(-7%) rotate(3deg) } }
.ch.g-workout img.body { animation: lift .5s ease-in-out 4; }

/* 번개 · 경조사 · 다가오는 일정 */
[data-venue="seafood"] { --venue-band:#1D5C7A; }
[data-venue="cafe"] { --venue-band:#7A4B35; }
[data-venue="camping"] { --venue-band:#B0431F; }
[data-venue="hiking"] { --venue-band:#4A5F78; }

   까페 dance = 앉은 채 어깨춤(가볍게) · 등산 dance = 가볍게 흔들기 · 골프장 dance = 나이스 샷 깡총 · 골프장 grill = 스윙 연습 */
[data-venue="cafe"] .ch.g-dance img.body, [data-venue="hiking"] .ch.g-dance img.body { animation: giggle .5s ease-in-out 4; }
[data-venue="golf"] .ch.g-dance img.body { animation: bounce .5s ease-in-out 4; }
@keyframes swing { 0%, 100% { transform: rotate(0) } 30% { transform: rotate(-12deg) } 60% { transform: rotate(12deg) } }
[data-venue="golf"] .ch.g-grill img.body { animation: swing .65s ease-in-out 3; }
.chip.flash { background: var(--warning-soft); color: var(--text); border-color: var(--warning); }
.ev-badge { display: inline-flex; align-items: center; justify-content: center; min-height: 28px; padding: 2px 8px; border-radius: 6px; border: 1.5px solid currentColor; font: 700 13px/18px var(--font-body); white-space: nowrap; flex: 0 0 auto; }
.ev-badge.joy { color: var(--danger); background: var(--danger-soft); }
.ev-badge.calm { color: var(--text); background: var(--surface-2); border-color: var(--text-muted); }
.up-row { display: flex !important; gap: 12px; align-items: center; padding: 10px 12px; min-height: 64px; }
.up-date { flex: 0 0 52px; text-align: center; border-radius: var(--r-md); background: var(--surface-2); padding: 4px 0; font: 700 13px/18px var(--font-body); color: var(--text-muted); }
.up-date b { display: block; font: 400 22px/26px var(--font-fun); color: var(--text); }

.card.stale { background: var(--surface-2); border-style: dashed; }

.finish-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.finish-row .grow { min-width: 0; flex: 1 1 160px; }
.date-warn { color: var(--warning); }
.ev-calm-line { margin: 10px 0 0; font-weight: 700; font-size: 17px; }
.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.quick .btn { padding-left: 6px; padding-right: 6px; min-width: 0; }
.rsvp.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rsvp.three .btn { font-size: 17px; line-height: 22px; padding: 6px 4px; min-width: 0; word-break: keep-all; }
.rsvp .btn.heart[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--btn-border); }
.seg.three button { min-width: 48px; padding: 0 6px; }

.ev-top { padding: 16px; text-align: center; border-bottom: 2px solid var(--border); background: var(--surface-2); }
.geunjo { display: inline-grid; place-items: center; width: 72px; height: 72px; border: 3px solid var(--text); border-radius: 6px; font: 700 20px/1 var(--font-body); letter-spacing: 2px; color: var(--text); background: var(--surface); }
.ev-joy { font: 400 26px/32px var(--font-fun); color: var(--danger); }
.acct { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface-2); }
.acct span { flex: 1 1 160px; min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
/* 찾아오는 길 상자: 상호·주소·지도 링크. 버튼은 진짜 <a> 링크 (새 창) */
.way { margin-top: 12px; padding: 14px; border-radius: var(--r-md); border: 2px solid var(--border-soft); background: var(--surface-2); scroll-margin-top: 72px; }

.way-links .btn, .way .btn.way-saved { min-height: 48px; padding: 6px 8px; flex-direction: column; gap: 0; line-height: 20px; overflow-wrap: anywhere; }

.btn.sm { min-height: 48px; padding: 6px 12px; font-size: 15px; }
.map-hint { margin-top: 8px; }
.fund { margin-top: 12px; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--border-soft); }
.date-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.date-row .input { flex: 1 1 auto; min-width: 0; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; animation: fall 1.8s ease-in forwards; }

.place-ph { display: grid; place-items: center; align-content: center; gap: 4px; width: 100%; height: 100%; background: var(--surface-2); color: var(--text-muted); font: 400 18px/24px var(--font-fun); text-align: center; }
.place-ph img { width: 56px; height: 56px; }
.stage > .place-ph.bg { position: absolute; inset: 0; align-content: start; padding-top: 18%; }
/* 부고 화면: 회색·먹색, 움직임 없음 */
:root[data-mood="calm"] { --accent:#3F444B; --on-accent:#FFFFFF; --accent-soft:#E7E7E5; --venue-band:#3B3F45; --danger:#3F444B; --danger-soft:#ECECEA; --success:#4F5560; --success-soft:#E9EAEC; --success-text:#3F444B; }

}
:root[data-theme="dark"][data-mood="calm"] { --accent:#C9CCD1; --on-accent:#1E2230; --accent-soft:#3A3D44; --venue-band:#2E3136; --danger:#C9CCD1; --danger-soft:#33363C; --success:#AEB3BA; --success-soft:#33363C; --success-text:#C9CCD1; }

/* 휴대폰 맨 위(시계·노치) 띠: 아래로 내린 글이 비쳐 보이지 않게 바탕색으로 칠함 */
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 26; pointer-events: none; }
.topband { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; background: var(--bg); margin-top: -12px; padding: 12px 0 6px; }
.todo { margin-top: 6px; padding: 8px 10px 10px; }
.todo .todo-head { display: flex; gap: 8px; align-items: center; font: 700 14px/20px var(--font-body); color: var(--text-muted); }
.todo .todo-head img, .todo .todo-head .qf { width: 32px; height: 32px; flex: 0 0 32px; }
.todo-chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
.tchip { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 48px; min-width: 0; padding: 4px 10px; border-radius: var(--r-md); border: 2px solid var(--border-soft); background: var(--surface-2); color: var(--text); font: 700 14px/18px var(--font-body); cursor: pointer; text-align: left; word-break: keep-all; overflow-wrap: anywhere; }

.tchip.warn { border-color: var(--warning); background: var(--warning-soft); }
.tchip.bad { border-color: var(--danger); background: var(--danger-soft); }

.todo-none { font: 400 18px/26px var(--font-fun); color: var(--text); }

.rec-item { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-soft); }

/* ---------- 도장, 레벨, 배지 (장면 기록으로 계산, 저장 안 함) ---------- */
function meetings() {
  const by = new Map();
  const tdy = ymd(today());
  const list = S.scenes.filter((s) => parseDate(s.date) && PLACES[s.place] && str(s.date) <= tdy).sort((a, b) => (Number(a.createdAt) || 0) - (Number(b.createdAt) || 0));
  for (const s of list) {
    let m = by.get(s.date);
    if (!m) { m = { date: s.date, place: s.place, att: new Set() }; by.set(s.date, m); }

}
function monthsBetween(a, b) { const [y1, m1] = a.split("-").map(Number), [y2, m2] = b.split("-").map(Number); return (y2 - y1) * 12 + (m2 - m1); }
function statsFor(id) {
  const ms = meetings();
  const mine = ms.filter((m) => m.att.has(id));
  const stamps = mine.length;
  let lv = 0; LEVELS.forEach((L, i) => { if (stamps >= L.at) lv = i; });
  let run = 0, best = 0;
  for (const m of ms.filter((x) => isRegular(x.date))) { if (m.att.has(id)) { run++; best = Math.max(best, run); } else run = 0; }
  const places = new Set(mine.map((m) => m.place));
  const seasons = new Set(mine.map((m) => { const mo = parseDate(m.date).getMonth() + 1; return mo >= 3 && mo <= 5 ? "봄" : mo <= 8 && mo >= 6 ? "여름" : mo >= 9 && mo <= 11 ? "가을" : "겨울"; }));
  const FM = feesMap();
  const paidMonths = Object.keys(FM).filter((k) => /^\d{4}-\d{2}$/.test(k) && FM[k] && FM[k].paid && FM[k].paid[id] === true).sort();
  let feeRun = 0, feeBest = 0, prev = null;
  for (const k of paidMonths) { feeRun = prev && monthsBetween(prev, k) === 1 ? feeRun + 1 : 1; feeBest = Math.max(feeBest, feeRun); prev = k; }
  const left = (n) => "앞으로 " + n + "번 더";
  const badges = [
    { id: "first_stamp", name: "첫 도장", got: stamps >= 1, hint: left(1 - stamps) },
    { id: "three_in_row", name: "세 번 연속", got: best >= 3, hint: "정기 모임 " + left(3 - run) },
    { id: "five_stamps", name: "반가운 얼굴", got: stamps >= 5, hint: left(5 - stamps) },
    { id: "all_places", name: "동네 한 바퀴", got: places.size >= 4, hint: "다른 장소 " + (4 - places.size) + "곳 더 (지금 " + places.size + "곳)" }, // 9곳 중 아무 곳이나 4종류 이상
    { id: "four_seasons", name: "사계절 도장", got: seasons.size >= 4, hint: "남은 계절: " + ["봄", "여름", "가을", "겨울"].filter((x) => !seasons.has(x)).join(", ") },
    { id: "dues_streak", name: "꼬박꼬박", got: feeBest >= 3, hint: "회비 " + (3 - feeRun) + "달 연속 더" },
  ];
  return { stamps, lv, mine, badges };
}

/* 말풍선·몸짓·뽑기 */
function layout(n) {
  const front = Math.min(n, 4), back = n - front;
  const pos = [];
  const fw = 26, fs = 24.5;
  for (let i = 0; i < front; i++) pos.push({ x: 50 - (front - 1) * fs / 2 + i * fs, b: 1.5, w: fw, z: 3 });
  const bs = Math.min(23, 94 / Math.max(back, 1)), bw = Math.min(24, bs + 2);
  for (let i = 0; i < back; i++) pos.push({ x: 50 - (back - 1) * bs / 2 + i * bs, b: 17.5, w: bw, z: 2 });
  return pos;
}
function sceneEngine(stage, members, place) {
  const P = PLACES[place];
  // 자리: 회장·총무를 앞줄 가운데로
  const pri = (m) => (m.role === "회장" ? 0 : m.role === "총무" ? 1 : 2);
  const ordered = members.slice().sort((a, b) => pri(a) - pri(b));
  let frontM = ordered.slice(0, 4), backM = ordered.slice(4);
  if (frontM.length === 4) frontM = [frontM[2], frontM[0], frontM[1], frontM[3]];
  else if (frontM.length === 3) frontM = [frontM[1], frontM[0], frontM[2]];
  const seat = frontM.concat(backM);
  const pos = layout(seat.length);
  const chars = seat.map((m, i) => {
    const p = pos[i];
    const img = h("img", { class: "body", src: artOf(m), alt: "", draggable: "false" });
    const el = h("button", { class: "ch", type: "button", "aria-label": str(m.name, 12) + " 한마디 듣기", style: "--x:" + p.x + "%;--b:" + p.b + "%;--w:" + p.w + "%;z-index:" + p.z + ";--d:" + (-(i * 0.37) % 3).toFixed(2) + "s" },
      img, h("span", { class: "tag" }, (m.role === "회장" ? "♛ " : "") + str(m.name, 12)));
    stage.append(el);
    const c = { m, el, pos: p, away: false, speaking: 0, pi: 0, turns: 0, phrases: arr(m.phrases).map((x) => str(x, 40)).filter(Boolean) };
    el.addEventListener("click", () => { if (!c.away && !drawing) speak(c); });
    return c;
  });
  const maxBubbles = chars.length <= 3 ? 1 : 2;
  const timers = new Set();
  const later = (fn, ms) => { const t = setTimeout(() => { timers.delete(t); fn(); }, ms); timers.add(t); return t; };
  let paused = false, drawing = false, stopped = false;
  let queue = [], lastSpeaker = null;
  const recent = [];
  let commonPool = [];
  const bubbles = [];
  const nextCommon = () => {
    if (!commonPool.length) commonPool = shuffle(P.lines);
    let i = commonPool.findIndex((l) => !recent.includes(l));
    if (i < 0) i = 0;
    return commonPool.splice(i, 1)[0];
  };
  function pickLine(c) {
    const ps = c.phrases;
    let line;
    c.turns++;
    if (ps.length >= 2) {
      for (let k = 0; k < ps.length; k++) { const cand = ps[(c.pi + k) % ps.length]; if (!recent.includes(cand)) { line = cand; c.pi = (c.pi + k + 1) % ps.length; break; } }
      if (!line) line = nextCommon();
    } else if (ps.length === 1) line = c.turns % 2 === 1 && !recent.includes(ps[0]) ? ps[0] : nextCommon();
    else line = nextCommon();
    recent.push(line); if (recent.length > 3) recent.shift();
    return line;
  }
  function nextSpeaker() {
    for (let tries = 0; tries < 2; tries++) {
      if (!queue.length) {
        queue = shuffle(chars);
        if (queue.length > 1 && queue[0] === lastSpeaker) [queue[0], queue[1]] = [queue[1], queue[0]];
      }
      while (queue.length) { const c = queue.shift(); if (!c.away && !c.speaking) return c; }
    }
    return null;
  }
  function mark(c, text, dx) {
    const sr = stage.getBoundingClientRect(), r = c.el.getBoundingClientRect();
    const mk = h("span", { class: "pop-mark" }, text);
    mk.style.left = Math.max(4, r.left - sr.left + r.width * (0.5 + (dx || 0)) - 14) + "px";
    mk.style.top = Math.max(4, r.top - sr.top - 4) + "px";
    stage.append(mk); later(() => mk.remove(), 2000);
  }
  function gesture(c, line) {
    const g = GESTURES[c.m.gesture] ? c.m.gesture : "wave";
    const goAway = g === "away" && (/화장실|다녀올/.test(line) || !c.phrases.some((p) => /화장실|다녀올/.test(p)));
    if (g === "away" && !goAway) return;
    c.el.classList.remove("g-" + g); void c.el.offsetWidth; c.el.classList.add("g-" + g);
    later(() => c.el.classList.remove("g-" + g), 2000);
    if (g === "joke") later(() => { mark(c, "ㅋㅋ"); const i = chars.indexOf(c); const nb = chars[i + 1] || chars[i - 1]; if (nb && !nb.away) mark(nb, "?"); }, 1000);
    if (g === "sing") { mark(c, "♪", 0.25); later(() => mark(c, "♫", -0.2), 700); }
    if (g === "workout") { mark(c, "하나!", -0.2); later(() => mark(c, "둘!", 0.2), 1000); }
    if (g === "away") later(() => {
      c.away = true; c.el.classList.add("away");
      const sign = h("span", { class: "sign" }, "잠깐 자리 비움"); c.el.append(sign);
      later(() => { c.away = false; c.el.classList.remove("away"); sign.remove(); }, 6000);
    }, 2000);
  }
  function bubble(c, text, extraClass) {
    while (bubbles.length >= maxBubbles) dropBubble(bubbles[0]);
    const sr = stage.getBoundingClientRect(), r = c.el.getBoundingClientRect();
    const cx = r.left - sr.left + r.width / 2;
    const head = r.top - sr.top + r.height * 0.2;
    const b = h("div", { class: "bubble" + (extraClass ? " " + extraClass : "") }, h("div", { class: "o" }, h("div", { class: "i" }, text)), h("span", { class: "tail" }));
    b.style.visibility = "hidden"; b.style.left = "0px"; b.style.top = "0px";
    stage.append(b);
    const bw = Math.min(b.offsetWidth, sr.width - 16), bh = b.offsetHeight;
    const left = Math.min(Math.max(8, cx - bw / 2), sr.width - bw - 8);
    b.style.left = left + "px"; b.style.top = Math.max(6, head - bh - 10) + "px"; b.style.maxWidth = (sr.width - 16) + "px";
    b.querySelector(".tail").style.left = Math.min(Math.max(16, cx - left), bw - 16) + "px";
    b.style.visibility = "";
    const rec = { b, c };
    bubbles.push(rec);
    c.speaking++;
    rec.t = later(() => dropBubble(rec), 4000);
    return rec;
  }
  function dropBubble(rec) {
    const i = bubbles.indexOf(rec); if (i < 0) return;
    bubbles.splice(i, 1); clearTimeout(rec.t); timers.delete(rec.t);
    rec.c && (rec.c.speaking = Math.max(0, rec.c.speaking - 1));
    rec.b.classList.add("out"); setTimeout(() => rec.b.remove(), 220);
  }
  function speak(c) {
    if (stopped) return;
    const line = pickLine(c);
    lastSpeaker = c;
    bubble(c, (c.m.gesture === "sing" && c.phrases.includes(line) ? "♪ " : "") + line);
    gesture(c, line);
  }
  function tick() {
    if (stopped) return;
    if (!paused && !drawing && document.visibilityState !== "hidden" && chars.length) { const c = nextSpeaker(); if (c) speak(c); }
    later(tick, 3000);
  }
  if (chars.length) later(() => { tick(); }, 700);
  // 장소에 들어갈 때 큐플이 안내는 장면 아래 안내 줄로 보여 줌 (말풍선 자리를 아끼기 위해)
  let lastPick = null, spinning = false, holdT = null;
  async function draw() {
    if (spinning || !chars.length) return null;
    if (holdT) { clearTimeout(holdT); timers.delete(holdT); holdT = null; }
    spinning = true; drawing = true;
    bubbles.slice().forEach(dropBubble);
    let pool = chars.filter((c) => c !== lastPick);
    if (!pool.length) pool = chars;
    const winner = pool[Math.floor(Math.random() * pool.length)];
    chars.forEach((c) => c.el.classList.remove("picked"));
    if (!reduced()) {
      const steps = 16;
      for (let i = 0; i < steps && !stopped; i++) {
        const c = chars[i % chars.length];
        c.el.classList.add("flash");
        await sleep(2000 / steps);
        c.el.classList.remove("flash");
      }
    }
    spinning = false;
    if (stopped) return null;
    lastPick = winner;
    winner.el.classList.add("picked");
    bubble(winner, P.result(str(winner.m.name, 12), str(G().intro, 60)).split("!")[0] + "!", "qple");
    holdT = later(() => { winner.el.classList.remove("picked"); drawing = false; holdT = null; }, 4000);
    return winner.m;
  }
  return {
    stop() { stopped = true; timers.forEach(clearTimeout); timers.clear(); },
    togglePause() { paused = !paused; return paused; },
    next() { if (drawing) return; const c = nextSpeaker(); if (c) speak(c); },
    draw,
  };
}

const propStale = (p) => p.status === "open" && (p.dates.length ? p.dates.every((x) => parseDate(x) < today()) : p.createdAt > 0 && today().getTime() + 864e5 - p.createdAt > 30 * 864e5);

/* ---------- 회비 내역 (통장 장부): 총무 연결 시 treasury/<총무 계정>.ledger, 아니면 ledger/main (회장). 둘 다 있으면 총무 것 ---------- */

  const endMonth = YM_RE.test(str(r.endMonth, 7)) ? str(r.endMonth, 7) : null;
  const skip = [...new Set(arr(r.skip).map((x) => str(x, 7)).filter((x) => YM_RE.test(x)))].sort().slice(-120);
  return { id: str(r.id, 40), label: str(r.label, 20).trim() || "정기 " + (r.kind === "in" ? "수입" : "지출"), amount, day, kind: r.kind, cat: LCATS.includes(r.cat) ? r.cat : "기타",
    startMonth: str(r.startMonth, 7), endMonth, memo: str(r.memo, 40), skip, at: Number(r.at) || 0 };

// 공지 화면(마친 모임)의 정산 칸

    h("button", { class: "btn full", type: "button", id: "btn-settle", style: "margin-top:10px", onclick: () => go("settle-" + mt.id) }, "정산하기")) : null;

    h("div", { class: "small", id: "settle-items-line", style: "margin-top:6px;overflow-wrap:anywhere" }, st.items.map((it) => (it.label ? it.label + " " : "") + it.amount.toLocaleString("ko-KR")).join(" / ") + " = " + won(st.total)),

  if (st.mode === "split") {
    const paid = settlePaidMap(mt);

    const lm = linkedMe();
    if (staff) {
      const nPaid = ppl.filter((m) => paid[m.id]).length;

        h("p", { class: "cap muted", style: "margin:2px 0 4px" }, "누가 안 냈는지는 회장·총무 화면에만 보여요."),
        h("div", { id: "settle-paid-list" }, ppl.map((m) => {

        })));

    } else if (lm && st.people.includes(lm.id)) kids.push(h("p", { class: "small", id: "settle-mine", style: "margin:10px 0 0;font-weight:700" }, "내 입금: " + (paid[lm.id] ? "확인됨 ✓" : "아직 확인 전") + " · " + payInfo(st).mine));
  }
  if (S.isChair || staff) kids.push(h("div", { class: "btn-row", style: "margin-top:10px" },
    h("button", { class: "btn", type: "button", id: "btn-settle-copy", onclick: () => copyText(settleText(mt, st), "정산 문구를 복사했어요. 단톡방에 붙여 넣으세요") }, "정산 문구 복사"),
    S.isChair ? h("button", { class: "btn", type: "button", id: "btn-settle-edit", onclick: () => go("settle-" + mt.id) }, "정산 고치기") : null));

/* ---------- 시작 ---------- */
async function init() {
  S.unsubs.forEach((u) => { try { typeof u === "function" && u(); } catch (e) {} }); S.unsubs = [];
  Object.assign(S, { phase: "loading", why: "", db: null, user: null, isChair: false, myId: null, groupLoaded: false, membersLoaded: false, scenesLoaded: false, meetingsLoaded: false, proposalsLoaded: false, eventsLoaded: false, eventreqsLoaded: false, ledgerLoaded: false, treasuryLoaded: false, rsvpsLoaded: false });
  render();
  const deadline = Date.now() + 10000;
  while (!(window.claude && typeof window.claude.use === "function") && Date.now() < deadline) await sleep(200);
  if (!(window.claude && typeof window.claude.use === "function")) { S.phase = "nodb"; S.why = "이 페이지를 연 곳에서는 모임 저장소를 쓸 수 없어요. 게시된 주소로 열어 주세요."; return render(); }
  const left = () => Math.max(500, deadline - Date.now());
  let db = null, user = null;
  try {
    const both = await Promise.all([withTimeout(window.claude.use("db"), left()), withTimeout(window.claude.use("user"), left())]);
    db = both[0]; user = both[1];
  } catch (e) { console.warn(e); }
  if (!db) { S.phase = "nodb"; S.why = "저장소가 응답하지 않았어요. 잠시 뒤 다시 시도해 주세요."; return render(); }
  S.db = db; S.user = user || null;
  try { S.isChair = user ? !!(await withTimeout(user.isOwner(), 10000)) : false; } catch (e) { S.isChair = false; }
  try { S.myId = user ? (await withTimeout(user.id(), 10000)) || null : null; if (S.myId != null) S.myId = String(S.myId); } catch (e) { S.myId = null; }
  S.phase = "ready";
  render();
  // 큐플이 초안(AI)은 있으면 쓰고, 없으면 버튼을 숨김. 회장만. 저장소 불러오기를 막지 않게 따로 기다림
  S.sample = null;
  if (S.isChair) withTimeout(Promise.resolve().then(() => window.claude.use("sample")), 10000).then((fn) => {
    S.sample = typeof fn === "function" ? fn : null;
    const b = document.getElementById("m-ai"); if (b) b.hidden = !S.sample;
  }).catch(() => { S.sample = null; });
  const onErr = (what) => (e) => { console.warn("구독 오류", what, e); toast("모임 내용을 불러오지 못한 부분이 있어요. 새로고침해 주세요.", true); };
  try {
    S.unsubs.push(db.doc("group/ahyung").onSnapshot((s) => { S.group = snapData(s); S.groupLoaded = true; refresh(); }, onErr("group")));
    S.unsubs.push(db.collection("members").onSnapshot((snap) => { S.members = docsOf(snap).map((m) => Object.assign(m, { name: str(m.name, 12) })); S.membersLoaded = true; refresh(); }, onErr("members")));
    S.unsubs.push(db.collection("applications").onSnapshot((snap) => { S.apps = docsOf(snap); refresh(); }, onErr("applications")));
    S.unsubs.push(db.collection("scenes").onSnapshot((snap) => { S.scenes = docsOf(snap); S.scenesLoaded = true; refresh(); }, onErr("scenes")));
    S.unsubs.push(db.collection("meetings").onSnapshot((snap) => { S.meetings = docsOf(snap); S.meetingsLoaded = true; refresh(); }, (e) => { S.meetingsLoaded = true; onErr("meetings")(e); refresh(); }));
    S.unsubs.push(db.collection("rsvps").onSnapshot((snap) => { S.rsvps = docsOf(snap); S.rsvpsLoaded = true; refresh(); }, (e) => { S.rsvpsLoaded = true; onErr("rsvps")(e); refresh(); }));
    S.unsubs.push(db.collection("treasury").onSnapshot((snap) => { const t = {}; docsOf(snap).forEach((d) => { t[d.id] = d; }); S.treasury = t; S.treasuryLoaded = true; refresh(); }, (e) => { S.treasuryLoaded = true; onErr("treasury")(e); refresh(); }));
    S.unsubs.push(db.doc("ledger/main").onSnapshot((s) => { S.ledgerMain = snapData(s); S.ledgerLoaded = true; refresh(); }, (e) => { S.ledgerLoaded = true; onErr("ledger")(e); refresh(); }));
    S.unsubs.push(db.collection("proposals").onSnapshot((snap) => { S.proposals = docsOf(snap); S.proposalsLoaded = true; refresh(); }, (e) => { S.proposalsLoaded = true; onErr("proposals")(e); refresh(); }));
    S.unsubs.push(db.collection("events").onSnapshot((snap) => { S.events = docsOf(snap); S.eventsLoaded = true; refresh(); }, (e) => { S.eventsLoaded = true; onErr("events")(e); refresh(); }));
    S.unsubs.push(db.collection("eventreqs").onSnapshot((snap) => { S.eventreqs = docsOf(snap); S.eventreqsLoaded = true; refresh(); }, (e) => { S.eventreqsLoaded = true; onErr("eventreqs")(e); refresh(); }));
    S.unsubs.push(db.collection("eventfund").onSnapshot((snap) => { const f = {}; docsOf(snap).forEach((d) => { f[d.id] = d; }); S.eventfund = f; refresh(); }, onErr("eventfund")));
    S.unsubs.push(db.collection("fees").onSnapshot((snap) => { const f = {}; docsOf(snap).forEach((d) => { f[d.id] = d; }); S.fees = f; refresh(); }, onErr("fees")));
  } catch (e) { console.warn(e); S.phase = "nodb"; S.why = "저장소를 읽지 못했어요."; return render(); }
  setTimeout(() => { if (S.phase === "ready" && (!S.groupLoaded || !S.membersLoaded)) { S.phase = "nodb"; S.why = "모임 내용을 10초 안에 불러오지 못했어요. 다시 시도해 주세요."; render(); } }, 10000);
}

(function boot() {
  try { const t = localStorage.getItem("ahyung-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  // Firebase판: 입장 화면(참여코드)을 통과한 뒤에 시작 (fbshim.js가 window.__appGate를 만듦. claude.ai판에는 없음)
  if (window.__appGate && typeof window.__appGate.then === "function") { window.__appGate.then(() => init()); return; }
  if (location.protocol === "file:" && !(window.claude && window.claude.use)) {
    const sc = document.createElement("script");
    sc.src = "mock.js";
    sc.onload = sc.onerror = () => init();
    document.head.appendChild(sc);
  } else init();
})();
